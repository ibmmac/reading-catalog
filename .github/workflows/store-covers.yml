name: Store cover images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cover JPEGs into covers/
        run: |
          mkdir -p covers
          download() {
            local out="$1" url="$2"
            if [ -f "covers/${out}" ]; then
              echo "already have $out"
              return 0
            fi
            echo "GET $out from $url"
            if curl -fsSL --retry 3 -A "Mozilla/5.0" -o "covers/${out}" "$url"; then
              local size
              size=$(wc -c < "covers/${out}" || echo 0)
              if [ "$size" -lt 2000 ]; then
                echo "too small ($size bytes), removing $out"
                rm -f "covers/${out}"
                return 1
              fi
              echo "ok $out ($size bytes)"
              return 0
            fi
            echo "FAILED $out"
            rm -f "covers/${out}"
            return 1
          }

          download night-before-kindergarten.jpg "https://images.randomhouse.com/cover/9780448425009" || true
          download cowboy-car.jpg "https://images-na.ssl-images-amazon.com/images/P/1503950972.01.LZZZZZZZ.jpg" || true
          download except-antarctica.jpg "https://cover.hoopladigital.com/vsa_9781728233277_270.jpeg" || true
          download butterfly.jpg "https://images.randomhouse.com/cover/9780375828829" || true
          download on-beyond-bugs.jpg "https://images-na.ssl-images-amazon.com/images/P/0679873031.01.LZZZZZZZ.jpg" || true
          download dont-close-your-eyes.jpg "https://images-na.ssl-images-amazon.com/images/P/140020951X.01.LZZZZZZZ.jpg" || true
          download old-lady-fly.jpg "https://images-na.ssl-images-amazon.com/images/P/1904550622.01.LZZZZZZZ.jpg" || true
          download chickens.jpg "https://images-na.ssl-images-amazon.com/images/P/1567663745.01.LZZZZZZZ.jpg" || true
          download swap.jpg "https://images-na.ssl-images-amazon.com/images/P/0763679909.01.LZZZZZZZ.jpg" || true
          download great-pumpkin.jpg "https://images-na.ssl-images-amazon.com/images/P/068984607X.01.LZZZZZZZ.jpg" || true
          download the-hat.jpg "https://images-na.ssl-images-amazon.com/images/P/039954738X.01.LZZZZZZZ.jpg" || true
          download invented.jpg "https://images-na.ssl-images-amazon.com/images/P/0449814971.01.LZZZZZZZ.jpg" || true
          download hooked-on-phonics.jpg "https://covers.openlibrary.org/b/isbn/9781887942423-L.jpg" || true

          download garfield-scary-tales.jpg "https://images-na.ssl-images-amazon.com/images/P/0448400365.01.LZZZZZZZ.jpg" \
            || download garfield-scary-tales.jpg "https://images-na.ssl-images-amazon.com/images/P/0816732930.01.LZZZZZZZ.jpg" \
            || download garfield-scary-tales.jpg "https://pictures.abebooks.com/isbn/9780448400365-us-300.jpg" \
            || download garfield-scary-tales.jpg "https://covers.openlibrary.org/b/isbn/9780448400365-L.jpg" \
            || true

          download whacky-jack.jpg "https://covers.openlibrary.org/b/isbn/9781887942423-L.jpg" \
            || download whacky-jack.jpg "https://images-na.ssl-images-amazon.com/images/P/1887942423.01.LZZZZZZZ.jpg" \
            || true

          download remember-balloons.jpg "https://images-na.ssl-images-amazon.com/images/P/1481489151.01.LZZZZZZZ.jpg" \
            || download remember-balloons.jpg "https://covers.openlibrary.org/b/isbn/9781481489157-L.jpg" \
            || true

          download frog-song.jpg "https://covers.openlibrary.org/b/isbn/9780805092547-L.jpg" \
            || download frog-song.jpg "https://images-na.ssl-images-amazon.com/images/P/0805092540.01.LZZZZZZZ.jpg" \
            || true

          download the-party.jpg "https://covers.openlibrary.org/b/isbn/9780316563307-L.jpg" \
            || download the-party.jpg "https://covers.openlibrary.org/b/isbn/9780316888608-L.jpg" \
            || true

          download saying-thanks.jpg "https://images-na.ssl-images-amazon.com/images/P/0689854102.01.LZZZZZZZ.jpg" \
            || download saying-thanks.jpg "https://covers.openlibrary.org/b/isbn/9780689854101-L.jpg" \
            || true

          download mccloskey.jpg "https://covers.openlibrary.org/b/isbn/9780670059348-L.jpg" \
            || download mccloskey.jpg "https://covers.openlibrary.org/b/isbn/067005934X-L.jpg" \
            || true

          download clam-i-am.jpg "https://covers.openlibrary.org/b/isbn/9780007284856-L.jpg" \
            || download clam-i-am.jpg "https://images.randomhouse.com/cover/9780375826267" \
            || true

          ls -la covers/

      - name: Decode any local base64 fallbacks
        run: |
          if ls covers/*.b64 >/dev/null 2>&1; then
            for f in covers/*.b64; do
              out="${f%.b64}.jpg"
              if [ ! -f "$out" ]; then
                echo "decode $f -> $out"
                base64 -d "$f" > "$out"
              fi
            done
          fi

      - name: Commit cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/*.jpg || true
          if git diff --cached --quiet; then
            echo "No cover images to commit"
          else
            git commit -m "Store book cover JPEGs in covers/"
            git push
          fi
